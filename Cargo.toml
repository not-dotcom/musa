[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/daemon",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Proyecto Musa"]

[workspace.dependencies]
anyhow = "1"
gdk-pixbuf = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 2
strip = "debuginfo"

[profile.dev]
opt-level = 1
